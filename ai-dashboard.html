<style>

  --border: #DEE2E6; --border-hi: #CED4DA; --text: #1A1A2E; --muted: #6C757D;
  --muted-dim: #ADB5BD; --green: #1C7C54; --green-bright: #00B894;
  --red: #B23A2E; --red-bright: #E74C3C; --amber: #D4A62A; --blue: #4A90D9;
  --violet: #651FFF; --accent: #00B894;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; transition:background .3s,color .3s; overflow:hidden; }

@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.chip:hover { border-color:var(--accent); color:var(--accent); }
.chip-active { border-color:var(--accent); color:var(--accent); background:rgba(0,230,118,.08); }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const C = {
  bg:'var(--bg)', bg2:'var(--bg2)', panel:'var(--panel)', panelHi:'var(--panel-hi)',
  border:'var(--border)', borderHi:'var(--border-hi)', text:'var(--text)', muted:'var(--muted)',
  mutedDim:'var(--muted-dim)', green:'var(--green)', greenBright:'var(--green-bright)',
  red:'var(--red)', redBright:'var(--red-bright)', amber:'var(--amber)', blue:'var(--blue)',
  violet:'var(--violet)', accent:'var(--accent)'
};

const ASSETS = [
  { id:"bitcoin", symbol:"BTC", name:"Bitcoin", type:"crypto" },
  { id:"ethereum", symbol:"ETH", name:"Ethereum", type:"crypto" },
  { id:"solana", symbol:"SOL", name:"Solana", type:"crypto" },
  { id:"binancecoin", symbol:"BNB", name:"BNB", type:"crypto" },
  { id:"ripple", symbol:"XRP", name:"XRP", type:"crypto" },
  { id:"dogecoin", symbol:"DOGE", name:"Dogecoin", type:"crypto" },
  { id:"reliance", symbol:"RELIANCE", name:"Reliance Industries", type:"stock_in", stooq:"reliance.in" },
  { id:"tcs", symbol:"TCS", name:"Tata Consultancy", type:"stock_in", stooq:"tcs.in" },
  { id:"infy", symbol:"INFY", name:"Infosys", type:"stock_in", stooq:"infy.in" },
  { id:"hdfcbank", symbol:"HDFCBANK", name:"HDFC Bank", type:"stock_in", stooq:"hdfcbank.in" },
  { id:"aapl", symbol:"AAPL", name:"Apple Inc.", type:"stock_us", stooq:"aapl.us" },
  { id:"tsla", symbol:"TSLA", name:"Tesla Inc.", type:"stock_us", stooq:"tsla.us" },
  { id:"nvda", symbol:"NVDA", name:"NVIDIA", type:"stock_us", stooq:"nvda.us" },
  { id:"msft", symbol:"MSFT", name:"Microsoft", type:"stock_us", stooq:"msft.us" },
];

// Mock data for instant render
const MOCK_CLOSES = {};
ASSETS.forEach((a) => {
  const base = a.type==='crypto' ? (a.symbol==='BTC'?45000:a.symbol==='ETH'?2400:50+Math.random()*200) : a.type==='stock_in'?2000+Math.random()*1000 : 100+Math.random()*300;
  const arr = []; let v = base;
  for(let d=0; d<365; d++) { v *= 1+((Math.sin(d*0.05)+Math.random()-0.5)*0.03); arr.push(Math.max(v,0.1)); }
  MOCK_CLOSES[a.id] = arr;
});

// Math helpers
function sma(arr,p){const o=[];for(let i=0;i<arr.length;i++){if(i<p-1){o.push(null);continue;}let s=0;for(let j=i-p+1;j<=i;j++)s+=arr[j];o.push(s/p);}return o;}
function ema(arr,p){const o=[],k=2/(p+1);let prev=null;for(let i=0;i<arr.length;i++){if(arr[i]==null){o.push(prev);continue;}prev=prev==null?arr[i]:arr[i]*k+prev*(1-k);o.push(prev);}return o;}
function rsi(closes,p=14){if(closes.length<p+1)return null;let g=0,l=0;for(let i=closes.length-p;i<closes.length;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d;}const ag=g/p,al=l/p;if(al===0)return 100;const rs=ag/al;return 100-100/(1+rs);}
function stdev(arr){const n=arr.length;if(n===0)return 0;const m=arr.reduce((a,b)=>a+b,0)/n;const v=arr.reduce((a,b)=>a+(b-m)**2,0)/n;return Math.sqrt(v);}
function macdCalc(c){const e12=ema(c,12),e26=ema(c,26);const ml=c.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null);const vm=ml.filter(v=>v!=null);const sr=ema(vm,9);const sl=new Array(ml.length-vm.length).fill(null).concat(sr);const h=ml.map((v,i)=>v!=null&&sl[i]!=null?v-sl[i]:null);return{macdLine:ml,signalLine:sl,hist:h};}

// Scoring engines
function computeTechnicalScore(closes){
  if(closes.length<30)return{score:50,notes:["Not enough price history yet"]};
  const notes=[];let score=50;
  const r=rsi(closes,14);
  if(r!=null){if(r<30){score+=15;notes.push("RSI "+r.toFixed(1)+" - oversold, bullish tilt");}else if(r>70){score-=15;notes.push("RSI "+r.toFixed(1)+" - overbought, bearish tilt");}else notes.push("RSI "+r.toFixed(1)+" - neutral");}
  const s20=sma(closes,20),s50=sma(closes,Math.min(50,closes.length-1));const lc=closes[closes.length-1];
  const ls20=s20[s20.length-1],ls50=s50[s50.length-1];
  if(ls20!=null&&lc>ls20){score+=8;notes.push("Price above 20-SMA - uptrend");}else if(ls20!=null){score-=8;notes.push("Price below 20-SMA - downtrend");}
  if(ls50!=null&&ls20!=null){if(ls20>ls50){score+=7;notes.push("Golden cross - 20 above 50 SMA");}else{score-=7;notes.push("Death cross - 20 below 50 SMA");}}
  const{hist}=macdCalc(closes);const lh=hist[hist.length-1],ph=hist[hist.length-2];
  if(lh!=null&&ph!=null){if(lh>0&&lh>ph){score+=10;notes.push("MACD rising - momentum building");}else if(lh>0){score+=4;notes.push("MACD positive but flattening");}else if(lh<0&&lh<ph){score-=10;notes.push("MACD falling - momentum weakening");}else{score-=4;notes.push("MACD negative but improving");}}
  const recent=closes.slice(-20);const vol=stdev(recent)/(recent.reduce((a,b)=>a+b,0)/recent.length);
  if(vol>0.06)notes.push("High volatility ("+(vol*100).toFixed(1)+"%) - wider stops advised");
  return{score:Math.max(0,Math.min(100,score)),notes,rsi:r,vol};
}
function computeQuantScore(closes){
  if(closes.length<20)return{score:50,notes:["Insufficient data"],sharpe:null};
  const rets=[];for(let i=1;i<closes.length;i++)rets.push((closes[i]-closes[i-1])/closes[i-1]);
  const mr=rets.reduce((a,b)=>a+b,0)/rets.length;const vr=stdev(rets)||1e-9;
  const sharpe=(mr/vr)*Math.sqrt(rets.length);let score=50+sharpe*8;const notes=[];
  notes.push("Mean return "+(mr*100).toFixed(2)+"%, vol "+(vr*100).toFixed(2)+"%");
  notes.push("Sharpe-like "+sharpe.toFixed(2));
  const last=closes[closes.length-1],first=closes[Math.max(0,closes.length-14)];
  const mom=(last-first)/first;score+=mom*100;
  notes.push("14-period momentum "+(mom*100).toFixed(2)+"%");
  return{score:Math.max(0,Math.min(100,score)),notes,sharpe};
}
function computeFundamentalScore(asset,marketData,closes){
  const notes=[];let score=50;
  if(asset.type==="crypto"&&marketData){
    const r=marketData.market_cap_rank;
    if(r&&r<=10){score+=12;notes.push("Top-10 market cap (#"+r+")");}
    else if(r&&r<=50){score+=5;notes.push("Mid-tier rank (#"+r+")");}
    else if(r){score-=5;notes.push("Lower rank (#"+r+")");}
    const c7=marketData.price_change_percentage_7d_in_currency;
    if(typeof c7==="number"){if(c7>5){score+=8;notes.push("7d +"+c7.toFixed(1)+"%");}else if(c7<-10){score-=8;notes.push("7d "+c7.toFixed(1)+"%");}}
    const v=marketData.total_volume,m=marketData.market_cap;
    if(v&&m){const liq=v/m;if(liq>0.08){score+=6;notes.push("Healthy liquidity");}else notes.push("Thin liquidity");}
  } else {
    if(closes.length>=60){const ls=sma(closes,60)[closes.length-1];const lc=closes[closes.length-1];
      if(ls!=null){const gap=(lc-ls)/ls;if(gap>0.05){score+=10;notes.push("Above 60-period trend - confidence");}else if(gap<-0.05){score-=10;notes.push("Below trend - eroding confidence");}else notes.push("Tracking long-run trend");}}
    const rv=stdev(closes.slice(-30));const mp=closes.slice(-30).reduce((a,b)=>a+b,0)/Math.min(30,closes.length);
    const relVol=rv/mp;
    if(relVol<0.02){score+=6;notes.push("Low volatility - stable");}else if(relVol>0.05){score-=4;notes.push("High volatility - uncertain");}
    notes.push("Equity fundamentals are market-derived proxies, not balance-sheet data");
  }
  return{score:Math.max(0,Math.min(100,score)),notes};
}
function verdictFromScore(s){if(s>=75)return{label:"STRONG BUY",color:C.greenBright};if(s>=58)return{label:"BUY",color:C.green};if(s>=42)return{label:"HOLD",color:C.amber};if(s>=25)return{label:"SELL",color:C.red};return{label:"STRONG SELL",color:C.redBright};}

// Backtest engine
function runBacktest(series,holdBars=10){
  if(!series||series.length<120)return{trades:[],stats:null,equityCurve:[],insufficientData:true};
  const closes=series.map(s=>s.close);const minLb=60;const trades=[];let equity=100;
  const equityCurve=[{t:series[minLb].t,equity}];
  for(let i=minLb;i<closes.length-holdBars;i+=holdBars){
    const wc=closes.slice(0,i+1);const tech=computeTechnicalScore(wc);const quant=computeQuantScore(wc);
    const score=tech.score*0.55+quant.score*0.45;const v=verdictFromScore(score);
    const ep=closes[i],ei=Math.min(i+holdBars,closes.length-1),xp=closes[ei];
    const rr=(xp-ep)/ep;let pr=0,side="FLAT";
    if(score>=58){side="LONG";pr=rr;}else if(score<=42){side="SHORT";pr=-rr;}
    if(side!=="FLAT"){equity*=1+pr;trades.push({date:new Date(series[i].t).toISOString().slice(0,10),exitDate:new Date(series[ei].t).toISOString().slice(0,10),score,side,ep,xp,returnPct:pr*100,win:pr>0});}
    equityCurve.push({t:series[ei].t,equity});
  }
  const wins=trades.filter(t=>t.win).length,total=trades.length;
  const winRate=total>0?(wins/total)*100:0;const avgReturn=total>0?trades.reduce((a,t)=>a+t.returnPct,0)/total:0;
  const totalReturn=((equity-100)/100)*100;
  const rets=trades.map(t=>t.returnPct/100);const meanR=rets.length?rets.reduce((a,b)=>a+b,0)/rets.length:0;const sdR=stdev(rets);
  const sharpe=sdR>0?(meanR/sdR)*Math.sqrt(252/holdBars):0;
  let peak=-Infinity,maxDD=0;equityCurve.forEach(p=>{if(p.equity>peak)peak=p.equity;const dd=((peak-p.equity)/peak)*100;if(dd>maxDD)maxDD=dd;});
  const bhReturn=((closes[closes.length-1]-closes[minLb])/closes[minLb])*100;
  const years=(series[series.length-1].t-series[minLb].t)/(365*24*60*60*1000);
  const cagr=years>0?(Math.pow(equity/100,1/years)-1)*100:0;
  return{trades,equityCurve,insufficientData:false,stats:{totalTrades:total,winRate,avgReturn,totalReturn,sharpe,maxDD,bhReturn,cagr,years,longTrades:trades.filter(t=>t.side==="LONG").length,shortTrades:trades.filter(t=>t.side==="SHORT").length}};
}

// Data fetching
async function fetchCryptoData(ids){
  try{const r=await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids="+ids.join(",")+"&order=market_cap_desc&sparkline=false&price_change_percentage=1h,24h,7d");if(!r.ok)throw 0;const m=await r.json();const b={};m.forEach(x=>b[x.id]=x);return b;}catch(e){return{};}
}
async function fetchCryptoSeries(id,days){
  try{const r=await fetch("https://api.coingecko.com/api/v3/coins/"+id+"/market_chart?vs_currency=usd&days="+days+"&interval=daily");if(!r.ok)throw 0;const d=await r.json();return d.prices.map(p=>({t:p[0],close:p[1]}));}catch(e){const mc=MOCK_CLOSES[id]||MOCK_CLOSES[ASSETS[0].id];const now=Date.now();return mc.map((c,i)=>({t:now-(mc.length-i)*86400000,close:c}));}
}
async function fetchStooqSeries(stooqSym){
  try{
    const url="https://api.allorigins.win/raw?url="+encodeURIComponent("https://stooq.com/q/d/l/?s="+stooqSym+"&i=d");
    const r=await fetch(url);if(!r.ok)throw 0;const text=await r.text();const lines=text.trim().split("\n");
    if(lines.length<2)throw 0;const rows=lines.slice(1).map(l=>l.split(","));
    const series=rows.map(r=>({t:new Date(r[0]).getTime(),close:parseFloat(r[4]),date:r[0]})).filter(r=>!isNaN(r.close)&&!isNaN(r.t));
    if(series.length<30)throw 0;return series;
  }catch(e){
    const mc=MOCK_CLOSES[stooqSym]||MOCK_CLOSES[ASSETS[0].id];const now=Date.now();
    return mc.map((c,i)=>({t:now-(mc.length-i)*86400000,close:c,date:new Date(now-(mc.length-i)*86400000).toISOString().slice(0,10)}));
  }
}

// UI Components
function Gauge({score}){
  const angle=-90+(score/100)*180;const v=verdictFromScore(score);
  const rad=d=>d*Math.PI/180;const ticks=[0,25,50,75,100];
  return React.createElement("svg",{viewBox:"0 0 260 168",width:"100%",style:{maxWidth:280}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:"gg",x1:"0%",y1:"0%",x2:"100%",y2:"0%"},
        React.createElement("stop",{offset:"0%",stopColor:"#F0665A"}),React.createElement("stop",{offset:"25%",stopColor:"#B23A2E"}),
        React.createElement("stop",{offset:"50%",stopColor:"#D4A62A"}),React.createElement("stop",{offset:"75%",stopColor:"#1C7C54"}),
        React.createElement("stop",{offset:"100%",stopColor:"#34D399"})
      )
    ),
    React.createElement("path",{d:"M30 140 A100 100 0 0 1 230 140",fill:"none",stroke:C.bg2,strokeWidth:18,strokeLinecap:"round"}),
    React.createElement("path",{d:"M30 140 A100 100 0 0 1 230 140",fill:"none",stroke:"url(#gg)",strokeWidth:10,strokeLinecap:"round",opacity:0.9}),
    ticks.map(function(t){var a=rad(-180+(t/100)*180);var x1=130+88*Math.cos(a),y1=140+88*Math.sin(a),x2=130+100*Math.cos(a),y2=140+100*Math.sin(a);return React.createElement("line",{key:t,x1:x1,y1:y1,x2:x2,y2:y2,stroke:C.mutedDim,strokeWidth:1.5});}),
    React.createElement("g",{transform:"rotate("+angle+" 130 140)"},
      React.createElement("line",{x1:130,y1:140,x2:130,y2:52,stroke:v.color,strokeWidth:2.5,strokeLinecap:"round"})
    ),
    React.createElement("circle",{cx:130,cy:140,r:6,fill:C.bg,stroke:v.color,strokeWidth:2.5}),
    React.createElement("text",{x:130,y:112,textAnchor:"middle",fontFamily:"JetBrains Mono",fontSize:34,fontWeight:700,fill:C.text,letterSpacing:-1},score.toFixed(0)),
    React.createElement("text",{x:130,y:163,textAnchor:"middle",fontFamily:"Space Grotesk",fontSize:13,fontWeight:700,letterSpacing:2,fill:v.color},v.label)
  );
}

function ScoreBar(props){return React.createElement("div",{style:{marginBottom:12}},
  React.createElement("div",{style:{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:11,color:C.muted,letterSpacing:0.5,textTransform:'uppercase'}},
    React.createElement("span",null,props.label),React.createElement("span",{className:"mono",style:{color:C.text}},props.score.toFixed(0))
  ),
  React.createElement("div",{style:{height:6,background:C.bg2,borderRadius:3,overflow:'hidden'}},
    React.createElement("div",{style:{width:props.score+"%",height:'100%',background:props.accent,transition:'width .6s'}}))
);}

function MiniSparkline(props){
  if(!props.closes||props.closes.length<2)return null;
  var w=100,h=32,min=Math.min.apply(null,props.closes),max=Math.max.apply(null,props.closes),range=max-min||1;
  var pts=props.closes.map(function(c,i){return (i/(props.closes.length-1))*w+","+(h-((c-min)/range)*h);}).join(" ");
  return React.createElement("svg",{width:w,height:h,viewBox:"0 0 "+w+" "+h,preserveAspectRatio:"none"},
    React.createElement("polyline",{points:pts,fill:"none",stroke:props.color||C.blue,strokeWidth:1.6}));
}

function TechnicalChart(props){
  if(!props.series||props.series.length<30)return React.createElement("div",{style:{padding:40,textAlign:'center',color:C.mutedDim,fontSize:13}},"Loading chart...");
  var closes=props.series.map(function(s){return s.close;});
  var w=900,hP=220,hR=70,hM=80,gap=14,totalH=hP+gap+hR+gap+hM+30;
  var s20=sma(closes,20),s50=sma(closes,50);
  var rsiS=closes.map(function(_,i){return i>=14?rsi(closes.slice(0,i+1),14):null;});
  var m=macdCalc(closes);
  var min=Math.min.apply(null,closes),max=Math.max.apply(null,closes),range=max-min||1;
  var xAt=function(i){return (i/(closes.length-1))*w;};
  var yP=function(v){return hP-((v-min)/range)*hP;};
  var pricePts=closes.map(function(c,i){return xAt(i)+","+yP(c);}).join(" ");
  var s20Pts=s20.map(function(v,i){return v!=null?xAt(i)+","+yP(v):'';}).filter(Boolean).join(" ");
  var s50Pts=s50.map(function(v,i){return v!=null?xAt(i)+","+yP(v):'';}).filter(Boolean).join(" ");
  var rsiPts=rsiS.map(function(v,i){return v!=null?xAt(i)+","+(hR-(v/100)*hR):'';}).filter(Boolean).join(" ");
  var histMin=Math.min.apply(null,m.hist.filter(function(v){return v!=null;})),histMax=Math.max.apply(null,m.hist.filter(function(v){return v!=null;}));
  var histRange=(histMax-histMin)||1;
  var macdPts=m.macdLine.map(function(v,i){return v!=null?xAt(i)+","+(hM-((v-histMin)/histRange)*hM):'';}).filter(Boolean).join(" ");
  var sigPts=m.signalLine.map(function(v,i){return v!=null?xAt(i)+","+(hM-((v-histMin)/histRange)*hM):'';}).filter(Boolean).join(" ");
  var lc=closes[closes.length-1],lastRsi=rsiS[rsiS.length-1],lastHist=m.hist[m.hist.length-1];
  var recentVol=stdev(closes.slice(-20));

              React.createElement("div",{className:"skeleton",style:{height:60,width:'100%',marginBottom:8}}),
              React.createElement("div",{className:"skeleton",style:{height:60,width:'100%',marginBottom:8}}),
              React.createElement("div",{className:"skeleton",style:{height:60,width:'100%'}})
            )
          ),
          React.createElement("div",{className:"glass",style:{padding:14}},
            React.createElement("div",{style:{fontSize:13,fontWeight:600,marginBottom:8}},"Analysis Notes"),
            React.createElement("div",{style:{fontSize:11,lineHeight:1.8,color:C.muted}},
              scores.notes&&scores.notes.length>0?scores.notes.map(function(n,i){
                return React.createElement("div",{key:i,style:{marginBottom:4,paddingLeft:10,borderLeft:"2px solid "+C.border}},n);
              }):"Analysis pending..."
            )
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
